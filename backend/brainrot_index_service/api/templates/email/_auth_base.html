<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5; padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">

          <tr>
            <td style="background:#0b1830; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:22px; font-weight:600; letter-spacing:0.5px;">
                Brainrot Index
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:40px;">
              <h2 style="margin:0 0 8px; color:#0b1830; font-size:20px;">{{ heading }}</h2>
              <p style="margin:0 0 24px; color:#6b7280; font-size:14px; line-height:1.5;">
                {{ body }}
              </p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
                <tr>
                  <td align="center">
                    <a href="{{ cta_url }}" style="display:inline-block; background:#2068ad; color:#ffffff; text-decoration:none; padding:14px 32px; border-radius:6px; font-size:14px; font-weight:600;">
                      {{ cta_label }}
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0; color:#9ca3af; font-size:12px; line-height:1.5;">
                If the button doesn't work, copy and paste this link into your browser:<br>
                <a href="{{ cta_url }}" style="color:#2068ad; word-break:break-all;">{{ cta_url }}</a>
              </p>

              <p style="margin:24px 0 0; color:#9ca3af; font-size:12px;">
                {{ footer_note }}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 40px; border-top:1px solid #e5e7eb; text-align:center;">
              <p style="margin:0; color:#9ca3af; font-size:12px;">
                Brainrot Index &mdash; brainrotindex.com
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
