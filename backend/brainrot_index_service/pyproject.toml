[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainrot-index-service"
version = "0.1.0"
description = "Brainrot Index website backend: accounts, subscriptions, and the classification API."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "google-auth>=2.62.0",
    "gunicorn==26.2.0",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "requests>=2.34.2",
    "django-anymail[resend]>=15.2",
    "argon2-cffi>=25.1.0",
    "pillow>=12.0",
    "stripe>=17.0.0",
    "youtube-transcript-api>=1.2.5",
]

[tool.setuptools]
packages = ["api", "billing", "brainrot_index_service", "classification", "families", "feedback", "store", "tuning"]
