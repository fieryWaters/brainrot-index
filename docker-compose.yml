# Brainrot Index stack: Postgres, the Django API, the classification worker,
# the local model server, and nginx serving the built frontend.
# All config comes from .env, which compose reads natively.
# Deploy: bash deploy.sh    Down: docker compose down

name: brainrot-index

services:
  db:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_DB: brainrot_index
      POSTGRES_USER: brainrot_index
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainrot_index -d brainrot_index"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/brainrot_index_service
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: brainrot-index-backend
    env_file:
      - .env
    environment:
      # Threaded workers: /api/classify/ waits up to 1.5 s for pending posts,
      # and a waiting request must not hold up the others.
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "16"
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8400:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          req=urllib.request.Request('http://127.0.0.1:8000/api/health/',
          headers={'X-Forwarded-Proto':'https'});
          urllib.request.urlopen(req, timeout=5).read()"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - backend_static:/app/staticfiles
      - post_images:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Downloads post images and runs pending classifications. Same image as
  # backend; it starts once backend is healthy, so migrations have run.
  worker:
    build:
      context: ./backend/brainrot_index_service
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: brainrot-index-backend
    entrypoint: ["python", "manage.py", "run_classification_worker"]
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, time; assert time.time() - os.path.getmtime('/tmp/classification-worker-heartbeat') < 15"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - post_images:/app/media
    depends_on:
      backend:
        condition: service_healthy
      inference:
        condition: service_healthy

  # The local vision-language model, used when INFERENCE_SOURCE=local, behind
  # an OpenAI-compatible API at http://inference:8000/v1 on the compose network
  # only. vLLM batches concurrent requests and caches each rubric's shared
  # prompt prefix; multi-token prediction (MTP) speeds up decoding. Thinking
  # is off: the classifier answers straight in JSON.
  inference:
    image: nvcr.io/nvidia/vllm:26.10.pre1-py3
    command:
      - vllm
      - serve
      - Qwen/Qwen3.5-9B
      # Weights quantized to FP8 when loaded, so the name the API and the
      # Classification rows show says so.
      - --served-model-name=Qwen/Qwen3.5-9B-FP8
      - --host=0.0.0.0
      - --port=8000
      - --gpu-memory-utilization=0.35
      - --max-model-len=8192
      - --max-num-seqs=64
      - --enable-prefix-caching
      - --quantization=fp8
      - --speculative-config={"method":"mtp","num_speculative_tokens":3}
      - --limit-mm-per-prompt={"image":4,"video":0}
      - --default-chat-template-kwargs={"enable_thinking":false}
    environment:
      HF_HOME: /models
    gpus: all
    shm_size: 16g
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Loading the weights and compiling takes several minutes.
      start_period: 900s
    volumes:
      - inference_models:/models

  web:
    build:
      context: ./frontend/brainrot-index-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_ENV: ${APP_ENV:-deployment}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "127.0.0.1:3400:80"
    volumes:
      - backend_static:/srv/static:ro

volumes:
  postgres_data:
  backend_static:
  post_images:
  inference_models:
