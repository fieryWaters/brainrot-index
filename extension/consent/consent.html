<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BrainRot Index: before you start</title>
  <link rel="stylesheet" href="consent.css">
</head>
<body>
  <main>
    <h1><img src="../icons/icon48.png" width="28" height="28" alt="">BrainRot Index</h1>
    <section id="disclosure">
      <p id="disclosure-text">To decide which posts to hide, BrainRot Index sends the posts you see on supported sites to our server, where our service judges them with AI from our service providers. We don't sell your data.</p>
      <p><a id="privacy-link" target="_blank">Privacy Policy</a></p>
      <div class="buttons">
        <button type="button" id="agree-button" class="primary">Agree and continue</button>
        <button type="button" id="not-now-button">Not now</button>
      </div>
    </section>
    <p id="outcome" hidden></p>
  </main>
  <script src="../extension-api.js"></script>
  <script src="consent.js"></script>
</body>
</html>
