<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brainrot Index</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Brainrot Index</h1>
  <p id="account-status">Checking account...</p>
  <p id="subscribe-row" hidden><a id="subscribe-link" class="subscribe-button" target="_blank">Subscribe</a></p>
  <label class="switch-row">
    <input type="checkbox" id="enabled-switch">
    Filtering on
  </label>
  <p>Checked this session: <span id="checked-count">0</span></p>
  <p>Blurred or hidden: <span id="acted-on-count">0</span></p>
  <p><a id="site-link" target="_blank">Open Brainrot Index</a></p>
  <form id="feedback-form">
    <textarea id="feedback-text" rows="3" placeholder="Something wrong? Tell us." required></textarea>
    <button type="submit">Send</button>
    <span id="feedback-status"></span>
  </form>
  <p class="commit-line">Version <span id="extension-commit"></span></p>
  <script src="../extension-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
