# Two ways in, told apart by the port they arrive on:
#   80   the private path: Caddy on spark (tailnet) -> 127.0.0.1:3400 -> here.
#        Caddy writes the client address as the only entry of X-Forwarded-For.
#   8080 the public path: Cloudflare -> cloudflared -> here. Not published on
#        the host, so only the cloudflared container can reach it. Cloudflare
#        writes the client address into CF-Connecting-IP.
# The address worked out here is sent to Django as X-Real-IP and as the only
# entry of X-Forwarded-For, replacing anything the client sent.

# Last entry of X-Forwarded-For, or the socket address when there is none.
map $http_x_forwarded_for $private_client_address {
    "~(?<last_forwarded_address>[^,\s]+)\s*$" $last_forwarded_address;
    default $remote_addr;
}

map $http_cf_connecting_ip $tunnel_client_address {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

map $server_port $client_address {
    8080 $tunnel_client_address;
    default $private_client_address;
}

# Requests for the public site, whichever port they came in on.
map $host $public_host {
    brainrotindex.com 1;
    www.brainrotindex.com 1;
    default 0;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Locations that set their own Cache-Control keep these security headers too.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # One public address, so cookies and CSRF origins have one host.
    if ($host = www.brainrotindex.com) {
        return 301 https://brainrotindex.com$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /api/ {
        # The backend is down or restarting: answer in the API's own JSON shape,
        # so the site can say so in words.
        error_page 502 503 504 = @backend_unavailable;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $client_address;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Django admin, for browsing posts and classifications. Private path only.
    location /admin/ {
        if ($public_host) {
            return 404;
        }
        if ($server_port = 8080) {
            return 404;
        }
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $client_address;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"error": "The BrainRot Index server is not answering. Please try again in a few minutes.", "code": "server_unavailable"}';
    }

    # The packed browser extension. brainrot-index-extension.zip is always the
    # newest version, so it is checked with the server on every download.
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=300";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
